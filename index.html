<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Embedded iframe Example</title>
    <link rel="stylesheet" href="styles.css" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.3/css/all.min.css"
    />
  </head>
  <body>
    <div id="sidebar" class="sidebar">
      <div class="logo-container">
        <img src="logo.png" alt="Logo" class="logo" />
      </div>
      <button id="toggleSidebar" class="toggle-btn">
        <i class="fas fa-bars"></i>
      </button>
      <div class="button-container"></div>
    </div>
    <div class="iframe-container">
      <iframe
        id="storyIframe"
        src="https://story.cyango.com/65e75b35caa72fd6d2e00f3b"
        sandbox="allow-same-origin allow-scripts allow-forms allow-popups allow-pointer-lock allow-presentation allow-downloads"
        allow="xr-spatial-tracking; fullscreen; camera; microphone; geolocation; autoplay"
        referrerpolicy="strict-origin-when-cross-origin"
        frameborder="0"
      ></iframe>
    </div>
    <script src="script.js"></script>
  </body>
</html>
